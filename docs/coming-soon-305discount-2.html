
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>305discount.com — Coming Soon</title>
  <style>
    :root {
      --bg: oklch(98.8% 0.002 240);
      --surface: oklch(100% 0 0);
      --fg: oklch(18% 0.015 250);
      --muted: oklch(48% 0.015 250);
      --border: oklch(91% 0.005 250);
      --border-focus: oklch(54% 0.22 255);
      --accent: oklch(52% 0.22 255);
      --accent-hover: oklch(46% 0.23 255);
      --accent-fg: oklch(99% 0 0);
      --danger: oklch(56% 0.21 28);
      --success: oklch(58% 0.18 145);

      --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif;
      --font-mono: ui-monospace, 'JetBrains Mono', Menlo, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: oklch(14% 0.01 250);
        --surface: oklch(18% 0.015 250);
        --fg: oklch(96% 0.005 250);
        --muted: oklch(65% 0.015 250);
        --border: oklch(27% 0.01 250);
        --border-focus: oklch(64% 0.22 255);
        --accent: oklch(62% 0.22 255);
        --accent-hover: oklch(68% 0.20 255);
        --accent-fg: oklch(15% 0.02 250);
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 1.5rem;
      background-image: 
        radial-gradient(ellipse at 50% 30%, oklch(96% 0.01 250 / 0.75), transparent 70%);
      overflow-x: hidden;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-image: 
          radial-gradient(ellipse at 50% 30%, oklch(22% 0.02 250 / 0.5), transparent 70%);
      }
    }

    .main-container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2.75rem 2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 
        0 1px 2px oklch(0% 0 0 / 0.03),
        0 8px 24px -6px oklch(0% 0 0 / 0.04);
      transition: box-shadow 0.25s ease;
    }

    .brand-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
      width: 100%;
    }

    .logo-frame {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 280px;
      min-height: 90px;
      margin-bottom: 1.25rem;
    }

    .brand-logo {
      width: 100%;
      max-height: 110px;
      object-fit: contain;
      display: block;
    }

    .brand-fallback {
      display: none;
      align-items: baseline;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 900;
      letter-spacing: -0.04em;
      font-size: 2.5rem;
      line-height: 1;
    }

    .brand-fallback .code {
      color: var(--accent);
      margin-right: 2px;
    }

    .brand-fallback .suffix {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: -0.01em;
      margin-left: 2px;
    }

    .tagline-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.9); }
    }

    .content-section {
      width: 100%;
      margin-bottom: 2rem;
    }

    .headline {
      font-family: var(--font-display);
      font-size: 2.35rem;
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.15;
      margin-bottom: 0.75rem;
      color: var(--fg);
    }

    .description {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--muted);
      max-width: 360px;
      margin: 0 auto;
    }

    .form-section {
      width: 100%;
    }

    .waitlist-form {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      width: 100%;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
      width: 100%;
    }

    .email-input {
      flex: 1;
      height: 48px;
      padding: 0 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .email-input::placeholder {
      color: var(--muted);
      opacity: 0.8;
    }

    .email-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px oklch(52% 0.22 255 / 0.15);
      background: var(--surface);
    }

    .submit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      padding: 0 1.35rem;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: var(--accent-fg);
      font-size: 0.92rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.18s ease, transform 0.1s ease;
    }

    .submit-btn:hover {
      background: var(--accent-hover);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .submit-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .form-message {
      font-size: 0.8rem;
      min-height: 1.2rem;
      color: var(--danger);
      transition: opacity 0.2s ease;
    }

    .success-panel {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem;
      border-radius: 14px;
      background: oklch(58% 0.18 145 / 0.08);
      border: 1px solid oklch(58% 0.18 145 / 0.25);
      width: 100%;
    }

    .success-icon {
      width: 24px;
      height: 24px;
      color: var(--success);
    }

    .success-text {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--fg);
    }

    .success-subtext {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .footer-meta {
      margin-top: 2rem;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }
      .main-container {
        padding: 2.25rem 1.25rem;
        border-radius: 20px;
      }
      .input-row {
        flex-direction: column;
      }
      .submit-btn {
        width: 100%;
      }
      .headline {
        font-size: 2rem;
      }
    }
  </style>
</head>

      &copy; 305discount.com &bull; Miami, FL
    </footer>

  </main>

  <script>
    function handleLogoError() {
      const img = document.getElementById('main-logo');
      if (img.src.endsWith('.svg')) {
        img.src = 'WhatsApp-Image-2026-09-12-at-5.40.34-PM.webp';
      } else {
        img.style.display = 'none';
        const fallback = document.getElementById('fallback-logo');
        if (fallback) fallback.style.display = 'flex';
      }
    }

    const form = document.getElementById('notify-form');
    const emailInput = document.getElementById('email-field');
    const submitBtn = document.getElementById('submit-btn');
    const messageEl = document.getElementById('form-message');
    const successBox = document.getElementById('success-box');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      messageEl.textContent = '';

      const email = emailInput.value.trim();
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!email) {
        messageEl.textContent = 'Please enter an email address.';
        emailInput.focus();
        return;
      }

      if (!emailRegex.test(email)) {
        messageEl.textContent = 'Please enter a valid email address.';
        emailInput.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Adding...';

      setTimeout(() => {
        form.style.display = 'none';
        successBox.style.display = 'flex';
        try {
          localStorage.setItem('305discount_waitlist', email);
        } catch (err) {}
      }, 450);
    });
  </script>

</body>
</html>
